<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/shortkaar-logo.svg" />
  <!-- viewport-fit=cover so the bottom tab bar can pad itself past the iOS home
       indicator with env(safe-area-inset-bottom); without it that inset reads 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0c22" />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="/fonts.css" />

  <title>Shortkaar · long videos in, viral shorts out</title>
  <meta name="description" content="Shortkaar turns long videos into ready-to-post vertical shorts: best moments, captions, branding and SEO copy." />
  <!-- A private tool: keep it out of search engines. -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Analytics — opt-in, disabled by default, and never loaded before consent.
       A plain `npm run build` (and every local `npm run dev`) leaves the two
       VITE_OPENPANEL_* variables unset, so nothing is initialised, no script is
       fetched and no request leaves the browser. Self-hosted instances are
       silent unless you deliberately turn this on.

       Nothing here RUNS on page load any more: it only publishes
       window.__osAnalyticsInit, and the React consent manager
       (src/lib/consent.js) calls it once the visitor has actually accepted the
       analytics category. Loading a tracker in the static <head> and asking
       afterwards is the exact pattern LSSI art. 22.2 forbids.

       op1.js is served from this origin (public/op1.js), not from
       openpanel.dev: a third-party script sees the visitor's IP and can be
       changed under us at any time.

       To collect analytics for your own deployment: point
       VITE_OPENPANEL_API_URL / VITE_OPENPANEL_CLIENT_ID at your own OpenPanel
       instance (see .env.example) and add your hostname to ANALYTICS_HOSTS. -->
    <script>
      window.op = window.op || function () { var n = []; return new Proxy(function () { arguments.length && n.push([].slice.call(arguments)); }, { get: function (t, r) { return "q" === r ? n : function () { n.push([r].concat([].slice.call(arguments))); }; }, has: function (t, r) { return "q" === r; } }); }();
      window.__osAnalyticsInit = (function () {
        var started = false;
        return function () {
          if (started) return false;
          // Vite substitutes these at build time and leaves the placeholder literal
          // in place when the variable is undefined.
          var apiUrl = "%VITE_OPENPANEL_API_URL%";
          var clientId = "%VITE_OPENPANEL_CLIENT_ID%";
          var unset = function (v) { return !v || v.charAt(0) === "%"; };
          if (unset(apiUrl) || unset(clientId)) return false;

          // Second gate: hosts allowed to report. A dist/ built with credentials
          // stays inert anywhere else (a fork, a mirror, a preview domain), so a
          // deployment can never report into somebody else's dashboard.
          var ANALYTICS_HOSTS = /^(www\.)?openshorts\.app$/;
          if (!ANALYTICS_HOSTS.test(location.hostname)) return false;

          started = true;
          window.op("init", {
            apiUrl: apiUrl,
            clientId: clientId,
            trackScreenViews: true,
            trackOutgoingLinks: true,
            trackAttributes: true,
          });

          var s = document.createElement("script");
          s.src = "/op1.js";
          s.defer = true;
          s.async = true;
          document.head.appendChild(s);
          return true;
        };
      })();
    </script>
  </head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
